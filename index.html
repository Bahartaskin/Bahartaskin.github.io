<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Bahar TASKIN — SDET Portfolio</title>
  <meta name="description" content="Bahar TASKIN — Software Development Engineer in Test."/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Fira+Code:wght@300;400;500&display=swap" rel="stylesheet"/>
  
  <style>
    :root {
      --bg-primary:    #f9fafb;
      --bg-secondary:  #f1f5f9;
      --bg-card:       #ffffff;
      --text-primary:  #1e293b;
      --text-secondary:#475569;
      --text-muted:    #64748b;
      --accent:        #8b5cf6;
      --accent-light:  #c4b5fd;
      --accent-soft:   rgba(139,92,246, 0.10);
      --accent-glow:   rgba(139,92,246, 0.20);
      --border:        #e2e8f0;
      --border-soft:   rgba(139,92,246, 0.18);
      --radius:        16px;
      --radius-lg:     24px;
      --shadow-card:   0 10px 38px -12px rgba(0,0,0,0.08);
      --shadow-glow:   0 0 44px rgba(139,92,246,0.14);
      --transition:    all 0.28s cubic-bezier(0.34, 1.56, 0.64, 1);

      --fs-base:       clamp(1rem, 2.2vw + 0.1rem, 1.125rem);
      --fs-h1:         clamp(2.8rem, 8vw + 0.5rem, 5.5rem);
      --fs-h2:         clamp(2rem, 5vw + 0.3rem, 3.2rem);
    }

    [data-theme="dark"] {
      --bg-primary:    #0f1117;
      --bg-secondary:  #161b22;
      --bg-card:       #1e293b;
      --text-primary:  #e2e8f0;
      --text-secondary:#94a3b8;
      --text-muted:    #6b7280;
      --accent:        #a78bfa;
      --accent-light:  #c4b5fd;
      --accent-soft:   rgba(167,139,250, 0.15);
      --accent-glow:   rgba(167,139,250, 0.25);
      --border:        #334155;
      --border-soft:   rgba(167,139,250, 0.25);
      --shadow-card:   0 10px 38px -12px rgba(0,0,0,0.5);
      --shadow-glow:   0 0 44px rgba(167,139,250,0.3);
    }

    /* light-dark() fallback için modern tarayıcılar (Chrome 125+, Safari 17.4+, Firefox 131+ 2025 itibarıyla iyi destek) */
    body {
      background: light-dark(
        linear-gradient(135deg, #f9fafb 0%, #f1f5f9 100%),
        linear-gradient(135deg, #0f1117 0%, #161b22 100%)
      );
      color: light-dark(#1e293b, #e2e8f0);
    }

    /* prefers-color-scheme otomatik başlangıç (JS override eder) */
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg-primary:    #0f1117;
        --bg-secondary:  #161b22;
        --bg-card:       #1e293b;
        --text-primary:  #e2e8f0;
        --text-secondary:#94a3b8;
        --text-muted:    #6b7280;
        --accent:        #a78bfa;
        --border:        #334155;
      }
    }

    /* Genel stiller (önceki responsive kodun devamı) */
    *, *::before, *::after { box-sizing: border-box; margin:0; padding:0; }
    html { scroll-behavior: smooth; font-size: 100%; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      line-height: 1.72;
      font-size: var(--fs-base);
      transition: background 0.4s ease, color 0.4s ease;
    }

    nav {
      background: light-dark(rgba(249,250,251,0.94), rgba(15,17,23,0.94));
      border-bottom: 1px solid light-dark(#e2e8f0, #334155);
      backdrop-filter: blur(16px);
    }

    .nav-logo { color: var(--accent); }

    .theme-toggle {
      background: none;
      border: none;
      font-size: 1.5rem;
      cursor: pointer;
      color: var(--text-secondary);
      padding: 0.6rem;
      border-radius: 50%;
      transition: var(--transition);
      min-width: 48px;
      min-height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .theme-toggle:hover { 
      background: var(--accent-soft); 
      color: var(--accent); 
      transform: scale(1.1);
    }

    .skill-card, .exp-card, .contact-card, .code-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-card);
      transition: var(--transition);
    }

    .tag { 
      background: var(--accent-soft); 
      color: var(--accent); 
      border-color: var(--border-soft); 
    }

    /* Responsive & diğer stiller aynı kalıyor... (kısalttım) */
    @media (max-width: 768px) {
      .nav-links { 
        display: none; 
        position: absolute; top: 100%; left: 0; right: 0;
        background: var(--bg-primary);
        padding: 1.5rem;
        border-bottom: 1px solid var(--border);
      }
      .nav-links.active { display: flex; flex-direction: column; }
      .menu-toggle { display: block; }
    }
  </style>
</head>
<body>

  <nav>
    <div class="nav-logo">&lt;<span>BaharTaskin</span> /&gt;</div>
    
    <div style="display:flex; align-items:center; gap:1.2rem;">
      <button class="theme-toggle" aria-label="Toggle dark mode">🌙</button>
      <button class="menu-toggle" aria-label="Toggle menu">☰</button>
    </div>
    
    <ul class="nav-links">
      <li><a href="#about">About</a></li>
      <li><a href="#skills">Skills</a></li>
      <li><a href="#experience">Experience</a></li>
      <li><a href="#contact">Contact</a></li>
    </ul>
  </nav>

  <!-- Hero, About, Skills, Experience, Contact bölümleri aynı kalabilir -->

  <!-- JavaScript: Theme Toggle + localStorage + prefers-color-scheme -->
  <script>
    const themeToggle = document.querySelector('.theme-toggle');
    const html = document.documentElement;
    const menuToggle = document.querySelector('.menu-toggle');
    const navLinks = document.querySelector('.nav-links');

    // Mevcut tema kontrolü
    function setTheme(theme) {
      html.setAttribute('data-theme', theme);
      localStorage.setItem('theme', theme);
      themeToggle.textContent = theme === 'dark' ? '☀️' : '🌙';
    }

    // Başlangıç: localStorage > prefers-color-scheme > light
    const savedTheme = localStorage.getItem('theme');
    if (savedTheme) {
      setTheme(savedTheme);
    } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
      setTheme('dark');
    } else {
      setTheme('light');
    }

    // Toggle tıklama
    themeToggle.addEventListener('click', () => {
      const current = html.getAttribute('data-theme') || 'light';
      setTheme(current === 'light' ? 'dark' : 'light');
    });

    // Sistem tema değişikliğini dinle (manuel seçim yoksa)
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => {
      if (!localStorage.getItem('theme')) {
        setTheme(e.matches ? 'dark' : 'light');
      }
    });

    // Hamburger menü
    menuToggle.addEventListener('click', () => {
      navLinks.classList.toggle('active');
    });

    // Mevcut typewriter, reveal observer kodları buraya eklenebilir...
  </script>
</body>
</html>
